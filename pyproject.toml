[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sai-evidence-rag-service"
version = "0.1.0"
description = "Evidence RAG: retrieval, grounded generation, and citations"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
aws = ["sagemaker>=2.240,<3", "boto3>=1.35,<2"]

[tool.setuptools.packages.find]
where = ["src"]
