apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: evidence-rag-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SaiMudunuri04/evidence-rag-service.git
    targetRevision: main
    path: k8s/helm/evidence-rag-service
  destination:
    server: https://kubernetes.default.svc
    namespace: evidence-rag-service
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
